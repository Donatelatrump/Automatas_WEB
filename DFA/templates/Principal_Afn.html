{% load static %}
{% csrf_token %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz AFN</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <script src="https://unpkg.com/konva@8.0.0/konva.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #333;
            color: #fff;
        }

        .menu-button {
            text-decoration: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .menu-button:hover {
            border-color: #fff;
        }

        .btn-copy {
            text-decoration: none;
            color: #000000;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
            background-color: gainsboro;
        }

        .btn-copy:hover {
            background-color: lightsteelblue;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .controls label {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .controls input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .button-group button {
            padding: 10px 20px;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .info-container {
            width: 80%;
            background-color: #f9f9f9;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info-container div {
            margin-bottom: 10px;
        }

        .info-container label {
            font-size: 1.2em;
            margin-right: 10px;
        }

        .info-container input[type="text"] {
            width: 50%;
            padding: 5px;
            font-size: 1em;
        }

        .no-seleccionable {
            user-select: none;
            pointer-events: none;
        }

        #canvas {
            width: 100%;
            height: 80vh;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <header>
        <h2>Autómata Finito No Determinista (AFN)</h2>
        <div>
            <a onclick="window.location.href='/DFA/'" class="btn btn-lg menu-button">DFA</a>
            <a onclick="window.location.href='/NFA/'" class="btn btn-lg menu-button">NFA</a>
            <a onclick="window.location.href='/AFN/'" class="btn btn-lg menu-button">AFN</a>
            <a onclick="window.location.href='/MT/'" class="btn btn-lg menu-button">Turing</a>
            <a onclick="window.location.href='/'" class="btn btn-lg menu-button">Menu</a>
        </div>
    </header>

    <main>
        <section class="canvas-container">
            <div id="canvas"></div>
        </section>

        <section class="controls">
            <h4>Opciones</h4>
            <div>
                <label><input type="checkbox" id="checkAgregarEstado">Agregar Estado</label>
                <label><input type="checkbox" id="checkAgregarConexion">Agregar Conexion</label>
                <label><input type="checkbox" id="checkEliminarEstado">Eliminar Estado</label>
                <label><input type="checkbox" id="checkEliminarConexion">Eliminar Conexion</label>
            </div>

            <button id="copyButton" class="btn btn-sm btn-copy mt-2">Copiar λ</button>
            <div id="copyMessage" class="alert alert-success mt-2" style="display: none;">Copiado correctamente</div>

            <input type="text" id="entrada" placeholder="Ingresa la palabra" class="mt-2 mb-2" />
            <div id="miTexto" class="mb-2"></div>
            <button id="btnProbarCadena" class="btn btn-primary mb-2">Probar Cadena</button>

            <div class="info-container" style="display:none;">
                <h4>Información del Estado</h4>
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" readonly>
                </div>
                <div>
                    <label for="coordenadaX">Coordenada X:</label>
                    <input type="text" id="coordenadaX">
                </div>
                <div>
                    <label for="coordenadaY">Coordenada Y:</label>
                    <input type="text" id="coordenadaY">
                </div>
                <div>
                    <label for="inicio">Inicio:</label>
                    <input type="checkbox" id="inicio">
                </div>
                <div>
                    <label for="salida">Salida:</label>
                    <input type="checkbox" id="salida">
                </div>
            </div>
        </section>
    </main>

    <script src="{% static 'script_NFA.js' %}"></script>
    <script>
       

       
        function convertirAFormatoCompacto(estados, conexiones) {
            let formato = [];
            for (let conexion of conexiones) {
                let inicioEstado = estados.find(e => e.x === conexion.inicio.x && e.y === conexion.inicio.y)?.nombre;
                let finEstado = estados.find(e => e.x === conexion.fin.x && e.y === conexion.fin.y)?.nombre;
                if (inicioEstado && finEstado) formato.push([inicioEstado, conexion.caracter, finEstado]);
            }
            return formato;
        }

        // Probar cadena
        document.getElementById('btnProbarCadena').addEventListener('click', function () {
            let { estados, conexiones } = obtenerEstadoYConexiones(); // Debe venir de script_NFA.js
            let estados2 = obtenerInicioYSalida();
            let entrada = obtenerText(estados2.inicio);
            let salida = obtenerTextFinal(estados2.salida);
            let datos = convertirAFormatoCompacto(estados, conexiones);
            let textoEntrada = document.getElementById('entrada').value;

            console.log("Depuración antes de enviar:");
            console.log("Estados:", estados);
            console.log("Conexiones:", datos);
            console.log("Entrada:", entrada);
            console.log("Salida:", salida);
            console.log("Palabra:", textoEntrada);

            if (!estados.length || !conexiones.length || !textoEntrada || !entrada.length || !salida.length) {
                alert("Faltan datos para probar la cadena");
                return;
            }

            let xhr = new XMLHttpRequest();
            xhr.open('POST', '/procesar_afn/', true);
            xhr.setRequestHeader('X-CSRFToken', document.getElementsByName('csrfmiddlewaretoken')[0].value);
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onload = function () {
                if (xhr.status >= 200 && xhr.status < 400) {
                    let resp = JSON.parse(xhr.responseText);
                    document.getElementById('miTexto').textContent = resp.aceptada ?
                        "La cadena es aceptada ✅" : "La cadena NO es aceptada ❌";
                } else {
                    console.error("Error en la solicitud:", xhr.statusText);
                }
            };

            xhr.onerror = function () {
                console.error("Error de conexión");
            };

            xhr.send(JSON.stringify({ 
    estados: estados, 
    conexiones: datos,   // aquí debe llamarse 'conexiones' como espera el backend
    palabra: textoEntrada, 
    inicios: entrada, 
    finales: salida 
}));
        });

        // Copiar λ
        document.getElementById('copyButton').addEventListener('click', function () {
            let textArea = document.createElement('textarea');
            textArea.value = 'λ';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            let copyMessage = document.getElementById('copyMessage');
            copyMessage.style.display = 'block';
            setTimeout(() => copyMessage.style.display = 'none', 1000);
        });
         function obtenerText(inicio) {
            let nombres = [];
            inicio.forEach(estado => {
                nombres.push(estado.nombre); // Accedemos a la propiedad 'nombre' del objeto estado
            });
            return nombres;
        }
        function obtenerTextFinal(final) {
            let nombres = [];
            final.forEach(estado => {
                nombres.push(estado.nombre); // Accedemos a la propiedad 'nombre' del objeto estado
            });

            return nombres;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
