{% load static %}
{% csrf_token %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz AFN</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <script src="https://unpkg.com/konva@8.0.0/konva.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --color-fondo: #333;
            --color-texto: #fff;
            --color-acento: #0d6efd;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            flex-wrap: wrap;
        }

        header h2 {
            font-size: 1.3rem;
            margin: 0;
        }

        header div {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .menu-button {
            text-decoration: none;
            color: var(--color-texto);
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .menu-button:hover {
            border-color: var(--color-texto);
        }

        main {
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas {
            width: 100%;
            height: 65vh;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #fff;
        }

        .controls {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-top: 20px;
        }

        .controls h4 {
            text-align: center;
            margin-bottom: 15px;
        }

        .controls div label {
            display: block;
            margin: 6px 0;
            font-size: 1rem;
        }

        .controls input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        .btn-copy {
            background-color: gainsboro;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-copy:hover {
            background-color: lightsteelblue;
        }

        #btnProbarCadena {
            width: 100%;
            font-size: 1.1rem;
        }

        .info-container {
            display: none;
            width: 100%;
            background-color: #f9f9f9;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-top: 15px;
        }

        .info-container input[type="text"] {
            width: 100%;
            padding: 5px;
            margin-bottom: 8px;
        }

        /* ✅ Estilos Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            header div {
                justify-content: center;
                gap: 4px;
            }

            .menu-button {
                padding: 6px 10px;
                font-size: 0.85rem;
            }

            #canvas {
                height: 55vh;
            }

            .controls {
                width: 95%;
                padding: 12px;
            }

            .controls label {
                font-size: 0.95rem;
            }

            #entrada {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>Autómata Finito No Determinista (AFN)</h2>
        <div>
            <a onclick="window.location.href='/DFA/'" class="btn menu-button">DFA</a>
            <a onclick="window.location.href='/NFA/'" class="btn menu-button">NFA</a>
            <a onclick="window.location.href='/AFN/'" class="btn menu-button">AFN</a>
            <a onclick="window.location.href='/MT/'" class="btn menu-button">Turing</a>
            <a onclick="window.location.href='/'" class="btn menu-button">Menu</a>
        </div>
    </header>

    <main>
        <section class="canvas-container">
            <div id="canvas"></div>
        </section>

        <section class="controls">
            <h4>Opciones</h4>
            <div>
                <label><input type="checkbox" id="checkAgregarEstado"> Agregar Estado</label>
                <label><input type="checkbox" id="checkAgregarConexion"> Agregar Conexión</label>
                <label><input type="checkbox" id="checkEliminarEstado"> Eliminar Estado</label>
                <label><input type="checkbox" id="checkEliminarConexion"> Eliminar Conexión</label>
            </div>

            <button id="copyButton" class="btn-copy mt-2">Copiar λ</button>
            <div id="copyMessage" class="alert alert-success mt-2" style="display: none;">Copiado correctamente</div>

            <input type="text" id="entrada" placeholder="Ingresa la palabra" class="mt-2 mb-2" />
            <div id="miTexto" class="text-center mb-2 fw-bold"></div>
            <button id="btnProbarCadena" class="btn btn-primary mb-2">Probar Cadena</button>

            <div class="info-container">
                <h4>Información del Estado</h4>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" readonly>

                <label for="coordenadaX">Coordenada X:</label>
                <input type="text" id="coordenadaX">

                <label for="coordenadaY">Coordenada Y:</label>
                <input type="text" id="coordenadaY">

                <label><input type="checkbox" id="inicio"> Inicio</label>
                <label><input type="checkbox" id="salida"> Salida</label>
            </div>
        </section>
    </main>

    <script src="{% static 'script_NFA.js' %}"></script>
    <script>
        function convertirAFormatoCompacto(estados, conexiones) {
            let formato = [];
            for (let conexion of conexiones) {
                let inicioEstado = estados.find(e => e.x === conexion.inicio.x && e.y === conexion.inicio.y)?.nombre;
                let finEstado = estados.find(e => e.x === conexion.fin.x && e.y === conexion.fin.y)?.nombre;
                if (inicioEstado && finEstado) formato.push([inicioEstado, conexion.caracter, finEstado]);
            }
            return formato;
        }

        document.getElementById('btnProbarCadena').addEventListener('click', function () {
            let { estados, conexiones } = obtenerEstadoYConexiones();
            let estados2 = obtenerInicioYSalida();
            let entrada = obtenerText(estados2.inicio);
            let salida = obtenerTextFinal(estados2.salida);
            let datos = convertirAFormatoCompacto(estados, conexiones);
            let textoEntrada = document.getElementById('entrada').value;

            if (!estados.length || !conexiones.length || !textoEntrada || !entrada.length || !salida.length) {
                alert("Faltan datos para probar la cadena");
                return;
            }

            let xhr = new XMLHttpRequest();
            xhr.open('POST', '/procesar_afn/', true);
            xhr.setRequestHeader('X-CSRFToken', document.getElementsByName('csrfmiddlewaretoken')[0].value);
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onload = function () {
                if (xhr.status >= 200 && xhr.status < 400) {
                    let resp = JSON.parse(xhr.responseText);
                    document.getElementById('miTexto').textContent = resp.aceptada ?
                        "La cadena es aceptada ✅" : "La cadena NO es aceptada ❌";
                } else {
                    console.error("Error en la solicitud:", xhr.statusText);
                }
            };

            xhr.send(JSON.stringify({
                estados: estados,
                conexiones: datos,
                palabra: textoEntrada,
                inicios: entrada,
                finales: salida
            }));
        });

        document.getElementById('copyButton').addEventListener('click', function () {
            navigator.clipboard.writeText('λ').then(() => {
                let copyMessage = document.getElementById('copyMessage');
                copyMessage.style.display = 'block';
                setTimeout(() => copyMessage.style.display = 'none', 1000);
            });
        });

        function obtenerText(inicio) {
            return inicio.map(estado => estado.nombre);
        }
        function obtenerTextFinal(final) {
            return final.map(estado => estado.nombre);
        }
    </script>
</body>
</html>
